<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Add Item</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Secure Admin Portal</h1>
        <div class="controls">
            <button onclick="window.location.href='index.html'">← Back to Dashboard</button>
        </div>
    </header>

    <main>
        <div class="form-container card">
            <h2>Add New Item</h2>
            <form id="addItemForm">
                
                <div class="form-group">
                    <label for="name">Item Name *</label>
                    <input type="text" id="name" required placeholder="e.g., Coleman Cooler">
                </div>

                <div class="form-group-row">
                    <div class="form-group">
                        <label for="quantity">Quantity *</label>
                        <input type="number" id="quantity" required min="1" value="1">
                    </div>
                    <div class="form-group">
                        <label for="assetType">Asset Type *</label>
                        <select id="assetType" required>
                            <option value="DURABLE">Durable (Reusable)</option>
                            <option value="CONSUMABLE">Consumable (Used up)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" required placeholder="e.g., Storage Room A - Shelf 2">
                </div>

                <div class="form-group">
                    <label for="categoryId">Category *</label>
                    <select id="categoryId" required>
                        <option value="">Loading categories...</option>
                    </select>
                </div>

                <hr>

                <div class="form-group">
                    <label for="adminToken">Admin Password *</label>
                    <input type="password" id="adminToken" required placeholder="Enter your secret token">
                </div>

                <button type="submit" class="submit-btn">Save to Database</button>
                <p id="statusMessage"></p>
            </form>
        </div>
    </main>

    <script src="add-item.js"></script>
</body>
</html>
