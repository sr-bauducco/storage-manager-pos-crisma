<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Item - Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Adicionar ao Estoque</h1>
        <div class="controls">
            <button onclick="window.location.href='index.html'" style="background-color: #7f8c8d;">⬅ Voltar ao Painel</button>
        </div>
    </header>

    <main>
        <div class="form-container">
            <h3>Novo Item</h3>
            <form id="addItemForm">
                
                <div class="input-group">
                    <label for="name">Nome do Item <span class="required">*</span></label>
                    <input type="text" id="name" placeholder="Ex: Barraca Iglu" required>
                </div>

                <div class="input-group">
                    <label for="quantity">Quantidade <span class="required">*</span></label>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>

                <div class="input-group">
                    <label for="categoryId">Categoria (Opcional)</label>
                    <select id="categoryId">
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="kit">Kit Pertencente (Opcional)</label>
                    <input type="text" id="kit" placeholder="Ex: Kit Primeiros Socorros">
                </div>

               <div class="input-group" style="margin-top: 30px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
                    <label for="adminToken">Senha do Administrador <span class="required">*</span></label>
                    <input type="password" id="adminToken" placeholder="Digite a senha para autorizar" required>
                    <small style="color: #64748b; font-size: 0.85rem; margin-top: 4px; display: block;">
                        Apenas usuários autorizados podem modificar o estoque.
                    </small>
                </div>

                <button type="submit" class="submit-btn">Adicionar Item</button>
                
                <div id="statusMessage"></div>
                
            </form>
        </div>
    </main>

    <script src="add-item.js"></script>
</body>
</html>
