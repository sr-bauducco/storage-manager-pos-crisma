<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal - Estoque</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Gerenciador de Estoque</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Pesquisar no estoque...">
            
            <button onclick="window.location.href='add-item.html'" style="background-color: #27ae60;">+ Novo Item</button>
        </div>
    </header>

    <main>
        <h2 style="color: #1e293b; text-align: center; margin-bottom: 30px;">Inventário Atual</h2>
        
        <div id="loadingText" style="text-align: center; color: #64748b; font-weight: bold;">
            Carregando estoque do servidor...
        </div>
        
        <div class="grid-container" id="inventoryGrid"></div>
    </main>

    <div id="bulkActionsBar" class="bulk-actions-bar" style="display: none;">
        <span id="selectedCount" style="font-weight: bold; margin-right: 15px;">0 selecionados</span>
        
        <input type="password" id="bulkAdminToken" placeholder="Senha do Admin" required>
        
        <input type="text" id="bulkKitName" placeholder="Nome do Novo Kit">
        <button class="btn-primary" onclick="assignKitToSelected()">📦 Agrupar em Kit</button>
        
        <button class="btn-danger" onclick="deleteSelected()">🗑️ Excluir</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
